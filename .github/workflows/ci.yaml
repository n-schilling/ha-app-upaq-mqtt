name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a new base image or linter release that breaks the build shows up
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./upaq_mqtt
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh upaq_mqtt/CHANGELOG.md "$(yq -r '.version' upaq_mqtt/config.yaml)" > /dev/null
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning
          upaq_mqtt/rootfs/etc/s6-overlay/s6-rc.d/bridge/run
          upaq_mqtt/rootfs/etc/s6-overlay/s6-rc.d/bridge/finish
          scripts/check.sh
          tests/make-certs.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        # The app's packages with their hashes as in the image, then the tools
        run: |
          pip install --require-hashes -r upaq_mqtt/requirements.txt
          pip install pytest==9.1.1 pytest-aiohttp==1.1.1 ruff==0.17.3
      - name: Ruff
        run: ruff check upaq_mqtt/rootfs/usr/lib/upaq_bridge tests
      - name: Start a broker
        # 1883 plain, 8883 with TLS and a throwaway CA
        run: |
          tests/make-certs.sh "${RUNNER_TEMP}/certs"
          docker run -d --name broker -p 1883:1883 -p 8883:8883 \
            -v "${PWD}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            -v "${RUNNER_TEMP}/certs:/mosquitto/certs:ro" \
            eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
      - name: Test
        env:
          MQTT_TEST_HOST: localhost
          MQTT_TEST_TLS_PORT: "8883"
        run: MQTT_TEST_CERTS="${RUNNER_TEMP}/certs" pytest -v
      - name: Broker log
        if: failure()
        run: docker logs broker

  image:
    name: Build and start (${{ matrix.arch }})
    # Each architecture on a runner of its own kind, no emulation: the image
    # is built and tested natively (the arm64 runners are free for public
    # repositories)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' upaq_mqtt/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t upaq-mqtt:test upaq_mqtt
      - name: Image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' upaq-mqtt:test)
          echo "image: ${arch}"
          [[ "${ARCH}/${arch}" == amd64/amd64 || "${ARCH}/${arch}" == aarch64/arm64 ]]
      - name: Start without options
        # The bridge loads as its own user, as the s6 service starts it, finds
        # no options and says what to set
        run: |
          out=$(docker run --rm --network none --user upaq -e PYTHONPATH=/usr/lib \
            --entrypoint python3 upaq-mqtt:test -m upaq_bridge 2>&1 || true)
          echo "${out}"
          grep -q '/data/options.json not readable' <<< "${out}"
