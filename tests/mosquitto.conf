# Broker for the tests: anonymous, no persistence; 8883 with TLS, its
# certificates from tests/make-certs.sh mounted at /mosquitto/certs
listener 1883
allow_anonymous true
persistence false

listener 8883
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
