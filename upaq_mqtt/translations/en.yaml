configuration:
  protect_host:
    name: Protect host
    description: Host name or IP address of the UniFi console running Protect, e.g. 192.168.1.1; a URL such as https://192.168.1.1/ works too.
  protect_username:
    name: Protect user
    description: Local Protect user. A view-only user is enough unless controls are enabled.
  protect_password:
    name: Protect password
  certificate_check:
    name: Certificate check
    description: "pin: trust the console's certificate seen first and only that one (recommended). accept_any: any certificate, also self-signed; encrypted, but the password is not protected against a man in the middle. public_ca: a certificate from a public CA, for a console reached by its name."
  verify_ssl:
    name: Verify certificate (before 2.4.0)
    description: Replaced by certificate_check; true still means public_ca.
  certificate_fingerprint:
    name: Certificate fingerprint
    description: Optional. SHA-256 fingerprint to pin instead of the one seen first; set, it always pins it.
  enable_controls:
    name: Enable controls
    description: Create LED and threshold controls in Home Assistant; the Protect user then needs write access.
  min_interval:
    name: Minimum interval
    description: Seconds between two published values of one reading; 0 publishes every change (about once a second).
  discovery_prefix:
    name: MQTT discovery prefix
    description: Prefix Home Assistant listens on for MQTT discovery.
  mqtt_host:
    name: MQTT host
    description: Only for a broker the Supervisor does not know; empty uses the Mosquitto broker app.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT user
  mqtt_password:
    name: MQTT password
  log_level:
    name: Log level
    description: "How much the app writes to its log: info, warning or error."
