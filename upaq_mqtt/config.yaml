name: UP-AirQuality MQTT Bridge
version: "2.5.2"
slug: upaq_mqtt
description: Brings UniFi Protect UP-AirQuality sensors into Home Assistant via MQTT discovery
url: https://github.com/n-schilling/ha-app-upaq-mqtt
homeassistant: 2026.11.0
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:want
map:
  - type: ssl
    read_only: true
options:
  protect_host: ""
  protect_username: ""
  protect_password: ""
  certificate_check: pin
  certificate_fingerprint: ""
  enable_controls: false
  min_interval: 60
  discovery_prefix: homeassistant
  log_level: info
schema:
  protect_host: str
  protect_username: str
  protect_password: password
  certificate_check: list(pin|accept_any|public_ca)
  verify_ssl: bool?
  certificate_fingerprint: match(^(([0-9A-Fa-f]{2}:?){31}[0-9A-Fa-f]{2})?$)?
  enable_controls: bool
  min_interval: int(0,3600)
  discovery_prefix: match(^[A-Za-z0-9_/-]+$)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  mqtt_ca: str?
  log_level: list(info|warning|error)
